name: "Compile release notes"
on:
  workflow_call:

jobs:
  compile-release-notes:
    if: github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    name: "Generate release notes"
    outputs:
      release_notes_file_name: ${{ steps.prepare-files-and-dirs.outputs.file_name }}
    permissions:
        contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Install git-cliff"
        shell: "bash"
        run: | # v2.14.2
          cargo install --git https://github.com/orhun/git-cliff.git --rev 5d996de8220d26c0cb8ff329d31791570cab262f git-cliff

      - name: "Prepare files and dirs"
        id: "prepare-files-and-dirs"
        shell: "bash"
        run: |
          DIR=$(mktemp -d)
          FILE_NAME="RELEASE_NOTES.md"
          echo "release_notes_path=$DIR/$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: "Generate release notes"
        shell: "bash"
        env:
          # Use the workflow token to authenticate to GitHub so that we are not ratelimited. git-cliff contacts GitHub to determine first time contributors and to associate commit hashes with GitHub URIs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cliff --current --config "${{ github.workspace }}/cliff.toml" --output "${{ steps.prepare-files-and-dirs.outputs.release_notes_path }}"

      - name: "Upload workflow release notes"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "release_notes-${{ github.ref_name }}"
          path: "${{ steps.prepare-files-and-dirs.outputs.release_notes_path }}"
          if-no-files-found: error
