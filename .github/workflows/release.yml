name: release

on:
  push:
    tags:
    - 'v[0-9].[0-9]+.[0-9]+'

jobs:
  compile-third-party-licenses:
    if: github.ref_type == 'tag'
    outputs:
      third-party-licenses-file-name: ${{ steps.compile-third-party-licenses.outputs.file_name }}
    runs-on: "ubuntu-latest"

    name: "Compile third party licenses"
    permissions:
        contents: "read"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up temp dir
      id: set-up-temp-dir
      shell: bash
      run: |
        DIR=$(mktemp -d)
        FILE_NAME="THIRD_PARTY_LICENSES.txt"
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        #go-version-file: '${{ github.workspace }}/go.mod'
        go-version: "stable"

    - name: Set up google/go-licenses # v2.0.1
      shell: "bash"
      run: |
        go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2

    - name: Create third party licenses file
      shell: "bash"
      run: |
        $(go env GOPATH)/bin/go-licenses report "${{ github.workspace }}/" \
          --ignore="$(go list -m)" \
          --template="${{ github.workspace }}/licenses.tpl" > "${{ steps.set-up-temp-dir.outputs.dir }}/${{ steps.set-up-temp-dir.outputs.file_name }}"

    - name: "Upload workflow third party licenses file"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        name: "third_party_licenses-${{ github.ref_name }}"
        path: "${{ steps.set-up-temp-dir.outputs.dir }}/${{ steps.set-up-temp-dir.outputs.file_name }}"
        if-no-files-found: error

  build-binaries:
    if: github.ref_type == 'tag'
    permissions:
      contents: "read"
    needs: ["compile-third-party-licenses"]
    strategy:
      fail-fast: true
      matrix: &targets
        include:
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-gnu",
              CGO_ENABLED: "1",
              # Shadow Stack Support
              CGO_CFLAGS: "-fcf-protection=full",
              CGO_LDFLAGS: "-Wl,-z,shstk -Wl,-z,ibt -Wl,-z,cet-report=error",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "arm64",
              TARGET: "linux-arm64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "amd64",
              TARGET: "windows-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "arm64",
              TARGET: "windows-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "amd64",
              TARGET: "darwin-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "arm64",
              TARGET: "darwin-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
    env:
      LD_FLAGS_COMMON: "-X github.com/cherryservers/cherryctl/cmd.Version=${{ github.ref_name }}"
      BINARY_NAME: "cherryctl"
      SOURCE_NAME: "${{ github.event.repository.name }}"
      DIST_DIR: ${{ github.workspace }}/dist
      ARCHIVE_DIR: ${{ github.workspace }}/dist/archives

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        #go-version-file: '${{ github.workspace }}/go.mod'
        go-version: "stable"

    - name: Set up temp dir and dist dir
      shell: bash
      run: |
        DIR=$(mktemp -d)
        echo "DIR=$DIR" >> "$GITHUB_ENV"

        mkdir -p "$DIST_DIR"

    - name: Build binary
      env:
        GOOS: ${{ matrix.GOOS }}
        GOARCH: ${{ matrix.GOARCH }}
        LD_FLAGS_TARGET: ${{ matrix.LD_FLAGS_TARGET }}
        MAIN_PATH: ${{ matrix.MAIN_PATH }}
        CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
        CGO_CFLAGS: ${{ matrix.CGO_CFLAGS }}
        CGO_LDFLAGS: ${{ matrix.CGO_LDFLAGS }}
      run: |
        go build \
          -trimpath \
          -ldflags "$LDFLAGS_COMMON $LD_FLAGS_TARGET" \
          -o "$DIR/$BINARY_NAME" \
          $MAIN_PATH

    - name: Copy cherryctl license into package dir
      shell: "bash"
      run: |
        cp "${{ github.workspace }}/LICENSE.md" "$DIR/LICENSE.md"

    - name: "Fetch worklow third party licenses and copy into package dir"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "third_party_licenses-${{ github.ref_name }}"
        path: ${{ env.DIR }}
        merge-multiple: true

    - name: "Generate checksums of package contents"
      shell: "bash"
      working-directory: ${{ env.DIR }}
      run: |
        sha256sum -- * > SHA256SUMS

    - name: "Archive assets"
      env:
        GOOS: ${{ matrix.GOOS }}
        ARCHIVE_NAME: ${{ format('{0}-{1}-{2}', env.BINARY_NAME, github.ref_name, matrix.TARGET) }}
      shell: "bash"
      run: |
        mkdir -p "$ARCHIVE_DIR"
        if [[ "$GOOS" == "windows" ]]; then
          (cd "$DIR" && zip -r "$ARCHIVE_DIR/$ARCHIVE_NAME.zip" .)
        else
          tar -cvzf "$ARCHIVE_DIR/$ARCHIVE_NAME.tar.gz" -C "$DIR" .
        fi

    - name: "Upload workflow artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "release-tarballs-${{ github.ref_name }}-${{ matrix.TARGET }}"
        path: "${{ env.ARCHIVE_DIR }}/*"
        if-no-files-found: error
        compression-level: 0

  compile-release-notes:
    uses: ".github/workflows/compile-release-notes.yml"

  create-homebrew-formula:
    if: github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    name: "Creates Homebrew formula"
    needs: ["build-binaries"]
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: matns/cherryctl
      BINARY_NAME: cherryctl
    steps:
      - name: "Generate formula"
        shell: "bash"
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/$SOURCE_REPO/releases/download/$TAG"
          DIR=$(mkdir -d)

          ASSETS_DIR=$(mkdir "$DIR/assets")
          FORMULA_DIR=$(mkdir -p "$DIR/tap/Formula)
          targets=(
            darwin-amd64,
            darwin-arm64,
            linux-amd64-static,
            linux-arm64-static
          )

          for target in "${targets[@]}"; do
            gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$BINARY_NAME-$TAG-$target.tar.gz"
          done

          sha() {
            sha256sum "assets/$BINARY_NAME-$TAG-$1.tar.gz" | cut -d ' ' -f1
          }

          cat > tap/Formula/cherryctl.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is automatically generated by GitHub Actions. DO NOT EDIT.
          class Cherryctl < Formula
            desc "Official Cherry Servers CLI"
            homepage "https://www.cherryservers.com/"
            version "$VERSION"
            license "MPL 2.0"

            on_macos do
              on_intel do
                url "$BASE_URL/$BINARY_NAME-$TAG-darwin-amd64.tar.gz"
                sha256 "$(sha darwin-amd64)"
              end

              on_arm do
                url "$BASE_URL/$BINARY_NAME-$TAG-darwin-arm64.tar.gz"
                sha256 "$(sha darwin-arm64)"
              end
            end

            on_linux do
              on_intel do
                url "$BASE_URL/$BINARY_NAME-$TAG-linux-amd64-static.tar.gz"
                sha256 "$(sha linux-amd64-static)"
              end

              on_arm do
                url "$BASE_URL/$BINARY_NAME-$TAG-linux-arm64-static.tar.gz"
                sha256 "$(sha linux-arm64-static)"
              end
            end

            def install
              bin.install "cherryctl"
              (pkgshare).install "THIRD_PARTY_NOTICES.txt"
              (pkgshare).install "SHA256SUMS"
              (share/"licenses"/name).install "LICENSE"
            end

            test do
              system "#{bin}/cherryctl", "-v"
            end

      - name: "Checkout Homebrew Tap Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matns/homebrew-cherryctl
          token: ${{ secrets.HOMEBREW_PUSH_TAP_FROM_RELEASE_CI_PAT }}
          path: homebrew-cherryctl
          ref: "master"

      - name: "Update tap"
        shell: "bash"
        run: |
          mkdir -p homebrew-cherryctl/Formula
          cp Formula/cherryctl.rb homebrew-cherryctl/Formula/cherryctl.rb

      - name: "Push updated formula"
        working-directory: "homebrew-cherryctl"
        shell: "bash"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cherryctl.rb

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
            fi

          git commit -m "chore: update cherryctl formula"
          git push origin HEAD:main



  publish-release:
    if: github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    name: "Create and publish release"
    needs: ["build-binaries", "compile-release-notes"]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
      SOURCE_NAME: "${{ github.event.repository.name }}"
      CHECKSUMS_FILE_PATH: ${{ github.event.repository.name }}-${{ github.ref_name }}.sha256sum # use repo name as binary name
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up anchore/syft # v1.54.1
        shell: "bash"
        run: |
          go install github.com/anchore/syft/cmd/syft@b254e6d92f28c3868a755f62fb3ca8f26e9fee76

      - name: "mkdir dist dir"
        shell: "bash"
        run: |
          mkdir -p "$DIST_DIR"

      - name: "Fetch worklow package artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "release-tarballs-${{ github.ref_name }}-*" # fetch all targets
          path: ${{ env.DIST_DIR }}
          merge-multiple: true

      - name: "Fetch worklow release notes"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "release_notes-${{ github.ref_name }}"
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: Set up sigstore/cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: "Generate repository source SBOM"
        shell: "bash"
        env:
          SOURCE_SBOM_NAME: "${{ env.SOURCE_NAME }}-${{ env.GITHUB_REF_NAME }}-source"
        run: |
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} --source-name "$SOURCE_NAME" --source-version "$GITHUB_REF_NAME" -o spdx-json=$DIST_DIR/$SOURCE_SBOM_NAME.spdx.json
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} --source-name "$SOURCE_NAME" --source-version "$GITHUB_REF_NAME" -o cyclonedx-json=$DIST_DIR/$SOURCE_SBOM_NAME.cdx.json

      - name: "Generate checksums of the release"
        shell: "bash"
        working-directory: "${{ env.DIST_DIR }}"
        run: |
          sha256sum -- * > $CHECKSUMS_FILE_PATH

      - name: "Generate build provenance attestation"
        id: "attest"
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "${{ env.DIST_DIR }}"
          show-summary: true

      # - name: "Sign checksums with sigstore"
      #   shell: "bash"
      #   run: |
      #     cosign sign-blob dist/$CHECKSUMS_FILE_PATH --bundle "$DIST_DIR/$CHECKSUMS_FILE_PATH.sigstore.json --yes

      - name: "Create release"
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $DIST_DIR/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ github.workspace }}/${{ needs.compile-release-notes.outputs.release_notes_file_name }}" \
            --verify-tag
