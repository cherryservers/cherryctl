name: release

on:
  push:
    tags:
    - 'v[0-9].[0-9]+.[0-9]+'

jobs:
  compile-third-party-licenses:
    uses: "./.github/workflows/release-compile-third-party-licenses.yml"

  compile-release-notes:
    uses: "./.github/workflows/release-compile-notes.yml"

  compile-packages:
    needs: "compile-third-party-licenses"
    uses: "./.github/workflows/release-compile-packages.yml"
    with:
     artifact_id_third_party_licenses: ${{ needs.compile-third-party-licenses.outputs.artifact_id }}

  publish-release:
    if: "github.ref_type == 'tag'"
    runs-on: "ubuntu-latest"
    name: "Create and publish release"

    needs: ["compile-packages", "compile-release-notes"]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
      SOURCE_NAME: "${{ github.event.repository.name }}"
      CHECKSUMS_FILE_PATH: "${{ github.event.repository.name }}-${{ github.ref_name }}.sha256sum" # use repo name as binary name
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      - name: "Prepare"
        id: "prepare"
        shell: "bash"
        run: |
          DIST_DIR="${{ github.workspace }}/dist"
          mkdir -p "$DIST_DIR"
          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

      - name: "Fetch worklow package artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "release-tarballs-${{ github.ref_name }}-*" # fetch all targets
          path: ${{ steps.prepare.outputs.dist_dir }}
          merge-multiple: true

      - name: "Fetch release notes"
        id: "fetch-release-notes"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.compile-release-notes.outputs.artifact_id_release_notes }}"
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: "Set up anchore/syft" # v1.54.1
        shell: "bash"
        run: |
          go install github.com/anchore/syft/cmd/syft@b254e6d92f28c3868a755f62fb3ca8f26e9fee76

      - name: "Generate repository source SBOM"
        shell: "bash"
        env:
          SOURCE_SBOM_NAME: "${{ env.SOURCE_NAME }}-${{ env.GITHUB_REF_NAME }}-source"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
        run: |
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} \
            --source-name "$SOURCE_NAME" \
            --source-version "$GITHUB_REF_NAME" \
            -o spdx-json="$DIST_DIR/$SOURCE_SBOM_NAME.spdx.json"

          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} \
          --source-name "$SOURCE_NAME" \
          --source-version "$GITHUB_REF_NAME" \
          -o cyclonedx-json="$DIST_DIR/$SOURCE_SBOM_NAME.cdx.json"

      - name: "Generate checksums of the release"
        shell: "bash"
        working-directory: "${{ steps.prepare.outputs.dist_dir }}"
        run: |
          sha256sum -- * > $CHECKSUMS_FILE_PATH

      - name: "Generate build provenance attestation"
        id: "attest"
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "${{ steps.prepare.outputs.dist_dir }}"
          show-summary: true

      # - name: Set up sigstore/cosign-installer
      #   uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # - name: "Sign checksums with sigstore"
      #   shell: "bash"
      #   env:
      #     DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
      #   run: |
      #     cosign sign-blob dist/$CHECKSUMS_FILE_PATH --bundle "$DIST_DIR/$CHECKSUMS_FILE_PATH.sigstore.json --yes

      - name: "Create release"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
        run: |
          gh release create "$GITHUB_REF_NAME" "$DIST_DIR/*" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ github.workspace }}/${{ needs.compile-release-notes.outputs.filename_release_notes }}" \
            --verify-tag
