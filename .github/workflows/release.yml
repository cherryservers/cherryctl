name: release

on:
  push:
    tags:
    - 'v[0-9].[0-9]+.[0-9]+'

jobs:
  build-binaries:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-gnu",
              CGO_ENABLED: "1",
              # Shadow Stack Support
              CGO_CFLAGS: "-fcf-protection=full",
              CGO_LDFLAGS: "-Wl,-z,shstk -Wl,-z,ibt -Wl,-z,cet-report=error",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "arm64",
              TARGET: "linux-arm64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "amd64",
              TARGET: "windows-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "arm64",
              TARGET: "windows-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "amd64",
              TARGET: "darwin-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "arm64",
              TARGET: "darwin-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
    env:
      LD_FLAGS_COMMON: "-X github.com/cherryservers/cherryctl/cmd.Version=${{ github.ref_name }}"
      BINARY_NAME: "cherryctl"
      SOURCE_NAME: "${{ github.event.repository.name }}"
      DIST_DIR: ${{ github.workspace }}/dist
      ARCHIVE_DIR: ${{ github.workspace }}/dist/archives

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        #go-version-file: '${{ github.workspace }}/go.mod'
        go-version: "stable"

    - name: Set up google/go-licenses # v2.0.1
      shell: "bash"
      run: |
        go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2

    - name: Set up temp dir and dist dir
      shell: bash
      run: |
        DIR=$(mktemp -d)
        echo "DIR=$DIR" >> "$GITHUB_ENV"

        mkdir -p "$DIST_DIR"

    - name: Build binary
      env:
        GOOS: ${{ matrix.GOOS }}
        GOARCH: ${{ matrix.GOARCH }}
        LD_FLAGS_TARGET: ${{ matrix.LD_FLAGS_TARGET }}
        MAIN_PATH: ${{ matrix.MAIN_PATH }}
        CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
        CGO_CFLAGS: ${{ matrix.CGO_CFLAGS }}
        CGO_LDFLAGS: ${{ matrix.CGO_LDFLAGS }}
      run: |
        go build \
          -ldflags "$LDFLAGS_COMMON $LD_FLAGS_TARGET" \
          -o "$DIR/$BINARY_NAME" \
          $MAIN_PATH

    - name: Gompile third party licenses
      shell: "bash"
      run: |
        go-licenses report ./ --ignore="$(go list -m)" --template=licenses.tpl > "$DIR/THIRD_PARTY_LICENSES.txt"
        cp "${{ github.workspace }}/LICENSE.md" "$DIR/LICENSE.md"

    - name: "Generate checksums of package contents"
      shell: "bash"
      working-directory: ${{ env.DIR }}
      run: |
        sha256sum -- * > SHA256SUMS
    - name: "Archive assets"
      env:
        ARCHIVE_NAME: ${{ format('{0}-{1}-{2}', env.BINARY_NAME, github.ref_name, matrix.TARGET) }}
      shell: "bash"
      run: |
        mkdir -p "$ARCHIVE_DIR"
        if [[ "$GOOS" == "windows" ]]; then
          (cd "$DIR" && zip -r "$ARCHIVE_DIR/$ARCHIVE_NAME.zip" .)
        else
          tar -cvzf "$ARCHIVE_DIR/$ARCHIVE_NAME.tar.gz" -C "$DIR" .
        fi

    - name: "Upload workflow artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "release-${{ env.BINARY_NAME }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}"
        path: "${{ env.ARCHIVE_DIR }}/*"
        if-no-files-found: error
        compression-level: 0

  generate-release-notes:
    if: github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    name: "Generate release notes"
    permissions:
        contents: "read"
    env:
      RELEASE_NOTES_FILE_NAME: "RELEASE_NOTES.md"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Install git-cliff"
        shell: "bash"
        run: | # v2.14.2
          cargo install --git https://github.com/orhun/git-cliff.git --rev 5d996de8220d26c0cb8ff329d31791570cab262f git-cliff
      - name: "Generate release notes"
        shell: "bash"
        run: |
          DIR=$(mktemp -d)
          git cliff --current --strip header --output "$DIR/$RELEASE_NOTES_FILE_NAME"
      - name: "Upload workflow artifacts"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "release_notes-${{ github.ref_name }}"
          path: "$DIR/$RELEASE_NOTES_FILE_NAME"
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    name: "Create and publish release"
    needs: "build-binaries"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
      SOURCE_NAME: "${{ github.event.repository.name }}"
      CHECKSUMS_FILE_PATH: ${{ github.event.repository.name }}-${{ github.ref_name }}.sha256sum # use repo name as binary name
      RELEASE_NOTES_FILE_NAME: "RELEASE_NOTES.md"
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up anchore/syft # v1.54.1
        shell: "bash"
        run: |
          go install github.com/anchore/syft/cmd/syft@b254e6d92f28c3868a755f62fb3ca8f26e9fee76
      - name: "mkdir dist dir"
        shell: "bash"
        run: |
          mkdir -p "$DIST_DIR"
      - name: "Fetch worklow package artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "release-*"
          path: ${{ env.DIST_DIR }}
          merge-multiple: true

      - name: "Fetch worklow release notes"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "release_notes-${{ github.ref_name }}"
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: Set up sigstore/cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: "Generate repository source SBOM"
        shell: "bash"
        env:
          SOURCE_SBOM_NAME: "${{ env.SOURCE_NAME }}-${{ env.GITHUB_REF_NAME }}-source"
        run: |
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} --source-name "$SOURCE_NAME" --source-version "$GITHUB_REF_NAME" -o spdx-json=$DIST_DIR/$SOURCE_SBOM_NAME.spdx.json
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} --source-name "$SOURCE_NAME" --source-version "$GITHUB_REF_NAME" -o cyclonedx-json=$DIST_DIR/$SOURCE_SBOM_NAME.cdx.json

      - name: "Generate checksums of the release"
        shell: "bash"
        working-directory: "${{ env.DIST_DIR }}"
        run: |
          sha256sum -- * > $CHECKSUMS_FILE_PATH

      - name: "Generate build provenance attestation"
        id: "attest"
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "${{ env.DIST_DIR }}"
          show-summary: true

      # - name: "Sign checksums with sigstore"
      #   shell: "bash"
      #   run: |
      #     cosign sign-blob dist/$CHECKSUMS_FILE_PATH --bundle "$DIST_DIR/$CHECKSUMS_FILE_PATH.sigstore.json --yes
      - name: "Create release"
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $DIST_DIR/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ github.workspace }}/$RELEASE_NOTES_FILE_NAME \
            --verify-tag
