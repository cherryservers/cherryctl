name: "Release: Compile packages"
on:
  workflow_call:

jobs:
  build-binaries:
    if: github.ref_type == 'tag'
    permissions:
      contents: "read"
    strategy:
      fail-fast: true
      matrix: &targets
        include:
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "amd64",
              TARGET: "linux-amd64-gnu",
              CGO_ENABLED: "1",
              # Shadow Stack Support
              CGO_CFLAGS: "-fcf-protection=full",
              CGO_LDFLAGS: "-Wl,-z,shstk -Wl,-z,ibt -Wl,-z,cet-report=error",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "linux",
              GOARCH: "arm64",
              TARGET: "linux-arm64-static",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_linux.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "amd64",
              TARGET: "windows-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "windows",
              GOARCH: "arm64",
              TARGET: "windows-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_windows.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "amd64",
              TARGET: "darwin-amd64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
          - {
              GOOS: "darwin",
              GOARCH: "arm64",
              TARGET: "darwin-arm64",
              CGO_ENABLED: "0",
              LD_FLAGS_TARGET: "",
              MAIN_PATH: "./main_darwin.go",
              runner: ubuntu-latest
            }
    env:
      LD_FLAGS_COMMON: "-X github.com/cherryservers/cherryctl/cmd.Version=${{ github.ref_name }}"
      BINARY_NAME: "cherryctl"
      SOURCE_NAME: "${{ github.event.repository.name }}"

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        #go-version-file: '${{ github.workspace }}/go.mod'
        go-version: "stable"

    - name: "Prepare"
      id: "prepare"
      shell: bash
      run: |
        DIR=$(mktemp -d) && echo "dir=$DIR" >> "$GITHUB_ENV"
        DIST_DIR=$(mktemp -d) && echo "dist_dir=$DIST_DIR" >> "$GITHUB_ENV"

    - name: Build binary
      env:
        GOOS: ${{ matrix.GOOS }}
        GOARCH: ${{ matrix.GOARCH }}
        LD_FLAGS_TARGET: ${{ matrix.LD_FLAGS_TARGET }}
        MAIN_PATH: ${{ matrix.MAIN_PATH }}
        CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
        CGO_CFLAGS: ${{ matrix.CGO_CFLAGS }}
        CGO_LDFLAGS: ${{ matrix.CGO_LDFLAGS }}

        $DIR: "${{ steps.prepare.outputs.dir }}"
      run: |
        go build \
          -trimpath \
          -ldflags "$LDFLAGS_COMMON $LD_FLAGS_TARGET" \
          -o "$DIR/$BINARY_NAME" \
          $MAIN_PATH

    - name: "Copy cherryctl license into package dir"
      shell: "bash"
      env:
        $DIR: "${{ steps.prepare.outputs.dir }}"
      run: |
        cp "${{ github.workspace }}/LICENSE.md" "$DIR/LICENSE.md"

    - name: "Fetch worklow third party licenses and copy into package dir"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "third_party_licenses-${{ github.ref_name }}"
        path: "${{ steps.prepare.outputs.dir }}"
        merge-multiple: true

    - name: "Generate checksums of package contents"
      shell: "bash"
      working-directory: "${{ steps.prepare.outputs.dir }}"
      run: |
        sha256sum -- * > SHA256SUMS

    - name: "Archive the package"
      env:
        GOOS: ${{ matrix.GOOS }}
        ARCHIVE_NAME: ${{ format('{0}-{1}-{2}', env.BINARY_NAME, github.ref_name, matrix.TARGET) }}
        DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
      shell: "bash"
      run: |
        if [[ "$GOOS" == "windows" ]]; then
          (cd "$DIR" && zip -r "$DIST_DIR/$ARCHIVE_NAME.zip" .)
        else
          tar -cvzf "$DIST_DIR/$ARCHIVE_NAME.tar.gz" -C "$DIR" .
        fi

    - name: "Upload workflow artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "release-tarballs-${{ github.ref_name }}-${{ matrix.TARGET }}"
        path: |
          "${{ steps.prepare.outputs.dist_dir }}/*.tar.gz"
          "${{ steps.prepare.outputs.dist_dir }}/*.zip"
        if-no-files-found: error
        compression-level: 0
